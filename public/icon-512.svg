<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base (Safe for maskable icons) -->
  <rect width="512" height="512" fill="#FAF8F5" rx="128" />
  
  <!-- Icon Core Container -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Communication Chat Bubble -->
  <path d="M140 180 C140 135.8 175.8 100 220 100 L320 100 C364.2 100 400 135.8 400 180 L400 260 C400 304.2 364.2 340 320 340 L230 340 L160 395 C150 403 140 396 140 384 Z" fill="url(#bubbleGrad)" opacity="0.95" />

  <!-- Crown / Mastery Emblem in Gold -->
  <g transform="translate(180, 155) scale(0.65)" filter="url(#shadow)">
    <path d="M30 140 L50 20 L115 80 L180 20 L200 140 Z" fill="url(#goldGrad)" />
    <!-- Crown Jewels / Clarity Nodes -->
    <circle cx="50" cy="20" r="14" fill="#FEF3C7" />
    <circle cx="115" cy="80" r="14" fill="#FEF3C7" />
    <circle cx="180" cy="20" r="14" fill="#FEF3C7" />
    <!-- Crown Base Band -->
    <rect x="25" y="140" width="180" height="24" rx="12" fill="url(#goldGrad)" />
    <circle cx="70" cy="152" r="6" fill="#1E1B4B" />
    <circle cx="115" cy="152" r="6" fill="#1E1B4B" />
    <circle cx="160" cy="152" r="6" fill="#1E1B4B" />
  </g>

  <!-- Sparkle / Persuasion Aura -->
  <path d="M360 140 Q360 160 380 160 Q360 160 360 180 Q360 160 340 160 Q360 160 360 140 Z" fill="#FDE68A" />
  <path d="M125 290 Q125 305 140 305 Q125 305 125 320 Q125 305 110 305 Q125 305 125 290 Z" fill="#FDE68A" />
</svg>
